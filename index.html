<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFX-D1 · Premium AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', sans-serif; }
  .luxury { font-family: 'Cormorant Garamond', serif; }
  .chat-scroll { scrollbar-width: none; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-50 to-stone-100 dark:from-zinc-950 dark:to-zinc-900 flex items-center justify-center p-4 transition-colors">
<div class="max-w-2xl w-full bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl overflow-hidden border border-amber-200 dark:border-zinc-700">

  <!-- SETUP -->
  <div id="setup" class="p-8">
    <div class="text-center mb-8">
      <div class="mx-auto w-20 h-20 bg-gradient-to-br from-amber-700 to-amber-500 rounded-2xl flex items-center justify-center text-white text-4xl shadow-inner">L</div>
      <h1 class="luxury text-5xl text-amber-900 dark:text-amber-100 mt-4">LFX-D1</h1>
      <p class="text-amber-600 dark:text-amber-400">Premium Intelligent Assistant</p>
    </div>
    
    <div class="space-y-6">
      <div>
        <label class="block text-xs font-medium text-amber-700 dark:text-amber-300 mb-1">SYSTEMOVÝ PROMPT</label>
        <textarea id="systemPrompt" class="w-full h-24 p-4 rounded-2xl border border-amber-200 dark:border-zinc-700 focus:border-amber-500 dark:focus:border-amber-400 outline-none bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100" placeholder="...">Jsi LFX-D1, velmi přátelský, teplý a podporující český AI asistent. Vždy mluvíš s respektem, empatií a laskavostí. Občas můžeš použít lehký, příjemný humor nebo vtipný komentář, který uživatele pobaví a zlepší mu náladu. Ale nikdy si z uživatele nedělej srandu, nezesměšňuj ho, nebuď sarkastický, ironický ani provokativní v žádné situaci. Tvé odpovědi mají být povzbuzující, užitečné a příjemné. Mluv přirozenou češtinou, používej emojis vhodně a vždy se snaž uživatele podpořit a potěšit.</textarea>
      </div>

      <div>
        <label class="block text-xs font-medium text-amber-700 dark:text-amber-300 mb-1">VÝBĚR MODELU</label>
        <select id="modelSelect" class="w-full p-4 rounded-2xl border border-amber-200 dark:border-zinc-700 focus:border-amber-500 outline-none bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100">
          <option value="openai/gpt-4o-mini">GPT-4o Mini (nejrychlejší & levný)</option>
          <option value="anthropic/claude-3-haiku-20240307">Claude 3 Haiku (velmi chytrý)</option>
          <option value="google/gemini-flash-1.5">Gemini Flash 1.5 (rychlý)</option>
          <option value="mistralai/mistral-7b-instruct">Mistral 7B (dobrý poměr cena/výkon)</option>
        </select>
      </div>
      
      <div>
        <label class="block text-xs font-medium text-amber-700 dark:text-amber-300 mb-1">OPENROUTER API KEY</label>
        <input id="apiKey" type="password" class="w-full p-4 rounded-2xl border border-amber-200 dark:border-zinc-700 focus:border-amber-500 outline-none bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100" placeholder="sk-or-v1-...">
      </div>
      
      <div>
        <label class="block text-xs font-medium text-amber-700 dark:text-amber-300 mb-1">TAVILY KEY (volitelné)</label>
        <input id="tavilyKey" type="password" class="w-full p-4 rounded-2xl border border-amber-200 dark:border-zinc-700 focus:border-amber-500 outline-none bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100" placeholder="tvly-...">
      </div>
      
      <button onclick="saveSetup()" class="w-full py-4 bg-gradient-to-r from-amber-700 to-amber-500 hover:from-amber-600 hover:to-amber-400 text-white rounded-2xl font-medium text-lg shadow-lg transition">Spustit LFX-D1 →</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatScreen" class="hidden flex flex-col h-[85vh]">
    <div class="bg-gradient-to-r from-amber-800 to-amber-600 dark:from-zinc-800 dark:to-zinc-700 text-white p-5 flex items-center justify-between">
      <div>
        <div class="luxury text-3xl">LFX-D1</div>
        <div class="text-xs opacity-75">Online • paměť aktivní • streaming</div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" id="themeToggle" class="w-9 h-9 flex items-center justify-center text-2xl rounded-2xl hover:bg-white/20 transition">🌙</button>
        <button onclick="resetChat()" class="text-xs px-4 py-2 bg-white/20 rounded-xl hover:bg-white/30">Nový chat</button>
      </div>
    </div>

    <div id="chat" class="flex-1 p-6 overflow-y-auto chat-scroll space-y-6 bg-[radial-gradient(#f5f0e8_1px,transparent_1px)] dark:bg-[radial-gradient(#3f3f46_1px,transparent_1px)] bg-[length:20px_20px]"></div>

    <div class="p-5 bg-white dark:bg-zinc-900 border-t border-amber-200 dark:border-zinc-700">
      <div class="flex gap-3">
        <input id="userInput" type="text" class="flex-1 px-6 py-4 rounded-3xl border border-amber-200 dark:border-zinc-700 focus:border-amber-500 outline-none text-lg bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white" placeholder="Napiš zprávu..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="w-14 h-14 bg-gradient-to-br from-amber-700 to-amber-500 text-white rounded-3xl flex items-center justify-center text-3xl shadow-xl hover:scale-110 transition">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// === PROMĚNNÉ ===
let messages = [];
let systemPrompt = "";
let apiKey = "";
let tavilyKey = "";
let selectedModel = "openai/gpt-4o-mini";

// Načtení všech dat + tmavý režim
function loadData() {
  apiKey = localStorage.getItem("apiKey") || "";
  tavilyKey = localStorage.getItem("tavilyKey") || "";
  selectedModel = localStorage.getItem("selectedModel") || "openai/gpt-4o-mini";
  systemPrompt = localStorage.getItem("systemPrompt") || "Jsi LFX-D1, velmi přátelský, teplý a podporující český AI asistent. Vždy mluvíš s respektem, empatií a laskavostí. Občas můžeš použít lehký, příjemný humor nebo vtipný komentář, který uživatele pobaví a zlepší mu náladu. Ale nikdy si z uživatele nedělej srandu, nezesměšňuj ho, nebuď sarkastický, ironický ani provokativní v žádné situaci. Tvé odpovědi mají být povzbuzující, užitečné a příjemné. Mluv přirozenou češtinou, používej emojis vhodně a vždy se snaž uživatele podpořit a potěšit.";
  
  document.getElementById("systemPrompt").value = systemPrompt;
  document.getElementById("modelSelect").value = selectedModel;
  if (apiKey) document.getElementById("apiKey").value = apiKey;
  if (tavilyKey) document.getElementById("tavilyKey").value = tavilyKey;

  // Tmavý režim
  const savedTheme = localStorage.getItem("theme") || "light";
  if (savedTheme === "dark") document.documentElement.classList.add("dark");
  document.getElementById("themeToggle").textContent = savedTheme === "dark" ? "☀️" : "🌙";

  const savedMessages = localStorage.getItem("chatHistory");
  if (savedMessages) {
    messages = JSON.parse(savedMessages);
    renderChat();
  }
}

// Uložení setupu
function saveSetup() {
  systemPrompt = document.getElementById("systemPrompt").value.trim();
  apiKey = document.getElementById("apiKey").value.trim();
  tavilyKey = document.getElementById("tavilyKey").value.trim();
  selectedModel = document.getElementById("modelSelect").value;

  if (!apiKey) return alert("Prosím vlož OpenRouter API klíč ❤️");
  
  localStorage.setItem("apiKey", apiKey);
  localStorage.setItem("tavilyKey", tavilyKey);
  localStorage.setItem("selectedModel", selectedModel);
  localStorage.setItem("systemPrompt", systemPrompt);
  
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("chatScreen").classList.remove("hidden");
  
  if (messages.length === 0) {
    messages.push({role: "system", content: systemPrompt});
    renderChat();
  }
}

// Přepínač tmavého režimu
function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  document.getElementById("themeToggle").textContent = isDark ? "☀️" : "🌙";
}

// Odeslání + STREAMING s vybraným modelem
async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text || !apiKey) return;
  
  messages.push({role: "user", content: text});
  renderChat();
  input.value = "";
  
  const assistantId = "msg-" + Date.now();
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML += `
    <div class="flex gap-4" id="${assistantId}">
      <div class="w-8 h-8 bg-gradient-to-br from-amber-700 to-amber-500 rounded-2xl flex-shrink-0"></div>
      <div class="flex-1 bg-amber-50 dark:bg-zinc-800 rounded-3xl px-6 py-4 text-amber-900 dark:text-amber-100 stream-text">...</div>
    </div>`;
  chatDiv.scrollTop = chatDiv.scrollHeight;
  
  try {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json",
        "HTTP-Referer": window.location.href,
        "X-Title": "LFX-D1"
      },
      body: JSON.stringify({
        model: selectedModel,
        messages: messages,
        stream: true
      })
    });
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantMessage = "";
    
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop();
      
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          try {
            const parsed = JSON.parse(data);
            const chunk = parsed.choices[0]?.delta?.content || "";
            assistantMessage += chunk;
            const msgEl = document.getElementById(assistantId);
            if (msgEl) msgEl.querySelector(".stream-text").innerHTML = marked.parse(assistantMessage);
          } catch(e) {}
        }
      }
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    messages.push({role: "assistant", content: assistantMessage});
    localStorage.setItem("chatHistory", JSON.stringify(messages));
    
  } catch(err) {
    alert("Chyba při připojení: " + err.message);
  }
}

function renderChat() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";
  messages.forEach(msg => {
    if (msg.role === "system") return;
    chatDiv.innerHTML += `
      <div class="flex ${msg.role === 'user' ? 'justify-end' : 'gap-4'}">
        ${msg.role === 'assistant' ? `<div class="w-8 h-8 bg-gradient-to-br from-amber-700 to-amber-500 rounded-2xl flex-shrink-0"></div>` : ''}
        <div class="max-w-[80%] px-6 py-4 rounded-3xl ${msg.role === 'user' ? 'bg-amber-600 text-white' : 'bg-amber-50 dark:bg-zinc-800 text-amber-900 dark:text-amber-100'}">
          ${marked.parse(msg.content)}
        </div>
      </div>`;
  });
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function resetChat() {
  if (confirm("Opravdu začít nový chat?")) {
    messages = [{role: "system", content: systemPrompt}];
    localStorage.setItem("chatHistory", JSON.stringify(messages));
    renderChat();
  }
}

// Inicializace
loadData();
if (apiKey) {
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("chatScreen").classList.remove("hidden");
}
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
             </html>
